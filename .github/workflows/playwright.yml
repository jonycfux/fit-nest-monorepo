name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    # tests/seed.spec.ts asserts on data from packages/api/src/db/seed.ts, so CI
    # needs a real Postgres to migrate and seed before the API server boots.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fitnest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fitnest
      CORS_ORIGIN: http://localhost:3000
      DEV_AUTH_BYPASS: "true"
      # The auth suite registers a real (throwaway) account against a Clerk dev
      # instance, so it needs credentials. Add these as repository secrets to
      # enable it — the run below falls back to the seed suite when they're absent.
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    # @fitnest/shared resolves via ./dist (gitignored), so a fresh checkout has
    # no entry point for Vite to resolve — the web-app's SSR render fails on
    # every route until the workspace packages are built.
    - name: Build workspace packages
      run: npm run build
    - name: Migrate database
      run: npm run db:migrate -w @fitnest/api
    - name: Seed database
      run: npm run db:seed -w @fitnest/api
    # The Playwright webServers boot the compiled output from the build step
    # above, so the suite runs against the same artifacts a deploy ships.
    - name: Run Playwright tests
      run: |
        if [ -n "$CLERK_SECRET_KEY" ] && [ -n "$VITE_CLERK_PUBLISHABLE_KEY" ]; then
          npx playwright test
        else
          echo "::warning::Clerk secrets not configured — skipping the auth suite."
          npx playwright test --project=seed-chromium --project=seed-firefox --project=seed-webkit
        fi
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
